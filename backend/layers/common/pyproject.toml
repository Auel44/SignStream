[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signstream_common"
version = "0.1.0"
description = "Shared helpers used across every SignStream Lambda."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
    "boto3>=1.34,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["signstream_common*"]
exclude = ["tests*"]
