name: backend-tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install shared layer + test deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e layers/common
          pip install pytest boto3

      - name: Run all backend test suites
        working-directory: backend
        run: bash scripts/test-all.sh
