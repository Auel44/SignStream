# Stands in for the S3 + CloudFront dictionary CDN.
#
# Two things it has to reproduce, because the extension depends on both:
#
#   1. The URL shape. The client requests `/<lang>/<sign-id>.json`, and a sign
#      id already carries its language — `/ghsl/ghsl-hello-v1.json`. On disk
#      the clip is `ghsl/hello-v1.json`, because the folder supplies the
#      language. In production `upload-dictionary.py` resolves this by naming
#      the S3 object from each clip's own `signId` field; here the rewrite
#      below does the same job read-only, so no files are duplicated.
#
#   2. CORS. The fetch comes from a content script whose Origin is
#      `chrome-extension://<id>`, which differs per install and cannot be
#      enumerated — hence `*`, exactly as the CloudFront response headers
#      policy is configured. Safe: the clips are public, read-only, non-personal.

# Stage 4 of the pipeline as it appears in `docker compose logs`: one line per
# keypoint clip the avatar fetched, with status and byte count, so a 404 (a
# sign id with no clip) is obvious next to the gloss line that produced it.
log_format clips '4 CLIP   $status  $request_uri  ${body_bytes_sent}B';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout clips;

    # Clips never change under a given URL — the version is in the sign id.
    # Short max-age here (not the year used in production) so re-running the
    # converter during development is picked up without a hard reload.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    # Private Network Access. The clip fetch comes from a content script running
    # on https://www.youtube.com — a public origin — and targets localhost, a
    # private address. Chrome preflights that crossing and refuses unless the
    # private server opts in with this header. Production does not need it (the
    # dictionary is a public CloudFront origin); this local stand-in does,
    # because it is the only part of the pipeline the *page* talks to directly.
    add_header Access-Control-Allow-Private-Network "true" always;
    add_header Cache-Control                "public, max-age=60" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # /ghsl/ghsl-hello-v1.json  →  /clips/ghsl/hello-v1.json
    location ~ "^/(asl|bsl|ghsl)/(?:asl|bsl|ghsl)-(.+\.json)$" {
        alias /clips/$1/$2;
        default_type application/json;
    }

    # Liveness probe, and a hint if someone opens the root in a browser.
    location = /healthz {
        # Not logged: the compose healthcheck runs every 10s and would bury the
        # clip fetches this log exists to show.
        access_log off;
        default_type text/plain;
        return 200 "dictionary ok\n";
    }
}
